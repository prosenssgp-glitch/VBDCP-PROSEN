name: Build V68 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find V68 ZIP
        run: |
          echo "Files in repository:"
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract V68 Project
        run: |
          rm -rf v68
          mkdir -p v68

          unzip -q "$ZIP_FILE" -d v68

          echo "Extracted files:"
          find v68 -maxdepth 3 -type f | head -100

      - name: Find Android Project
        run: |
          PROJECT_DIR=$(find v68 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project settings.gradle not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android Project
        run: |
          cd "$PROJECT_DIR"

          echo "Project files:"
          ls -lah

          echo "App folder:"
          ls -lah app

      - name: Build V68 Debug APK
        run: |
          cd "$PROJECT_DIR"

          gradle :app:assembleDebug --no-daemon

      - name: Check APK
        run: |
          echo "APK files:"
          find "$PROJECT_DIR/app/build/outputs" -type f -name "*.apk" -print

      - name: Upload V68 APK
        uses: actions/upload-artifact@v4
        with:
          name: VBDCP-V68-debug-apk
          path: v68/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
