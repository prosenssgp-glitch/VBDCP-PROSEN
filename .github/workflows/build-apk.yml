name: Build VBDCP signed Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, "fix/**" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify release signing inputs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -f vbdcp-release.keystore || { echo "::error::Release keystore is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Add the repository Actions secret KEYSTORE_PASSWORD"; exit 1; }
      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VBDCP-Android-v1.9-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
