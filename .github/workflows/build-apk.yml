name: Build V68 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract V68 Project
        run: |
          unzip -q VBDCP-NativeCamera-V68-TodayAttendance-Centered.zip
          cd VBDCP-NativeCamera-APK
          echo "V68 project extracted successfully"
          ls -la

      - name: Build V68 Debug APK
        run: |
          cd VBDCP-NativeCamera-APK
          gradle :app:assembleDebug --no-daemon

      - name: Upload V68 APK
        uses: actions/upload-artifact@v4
        with:
          name: VBDCP-V68-debug-apk
          path: VBDCP-NativeCamera-APK/app/build/outputs/apk/debug/app-debug.apk
